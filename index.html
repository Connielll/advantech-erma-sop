<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advantech eRMA 互動式操作技能樹 | Interactive Operational SOP</title>
  <style>
    /* -------------------------------------------------------------
       DESIGN SYSTEM: Unslopped Industrial / Technical Tokens
       Neutral Ramp: Graphite/Ink (#0c0e14, #12151e, #181c27, #222736)
       Accent: Advantech Official Navy/Blue (#004280, #0066cc)
       Spacing Scale: 4, 8, 12, 16, 20, 24, 32, 48px
       Radii Scale: 4px (tags), 6px (buttons/inputs), 10px (cards), 12px (modals)
       Motion: cubic-bezier(0.22, 1, 0.36, 1) 150ms-250ms
       ------------------------------------------------------------- */
    :root {
      --bg-page: #0c0e14;
      --bg-surface: #12151e;
      --bg-card: #151924;
      --bg-card-hover: #1b212f;
      --bg-raised: #1f2535;
      --hairline: rgba(255, 255, 255, 0.08);
      --hairline-hover: rgba(255, 255, 255, 0.16);

      --adv-navy: #004280;
      --adv-blue: #0066cc;
      --adv-blue-hover: #0077e6;

      --text-primary: #ededed;
      --text-secondary: #9da6b8;
      --text-muted: #6b7588;

      --status-green: #10b981;
      --status-amber: #f59e0b;
      --status-blue: #3b82f6;

      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 10px;
      --radius-xl: 12px;

      --ease-std: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Global Tabular Figures for All Numbers */
    .tabular {
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* TOP HEADER: 56px Tall, Calm Monochrome Surface */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(12, 14, 20, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--hairline);
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-logo {
      height: 24px;
      width: auto;
      display: block;
      border-radius: var(--radius-sm);
    }

    .brand-divider {
      width: 1px;
      height: 18px;
      background: var(--hairline);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 13px;
    }

    /* ROLE TRACK FILTERS: Quiet Button Row */
    .track-filters {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-md);
      padding: 2px;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 150ms var(--ease-std), background 150ms var(--ease-std);
      user-select: none;
    }

    .filter-btn:hover {
      color: var(--text-primary);
      background: var(--bg-raised);
    }

    .filter-btn.active {
      background: var(--bg-raised);
      color: var(--text-primary);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .filter-btn svg {
      color: var(--text-muted);
      transition: color 150ms var(--ease-std);
    }

    .filter-btn.active svg {
      color: var(--adv-blue);
    }

    /* HEADER RIGHT CONTROLS */
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .search-input {
      background: var(--bg-surface);
      border: 1px solid var(--hairline);
      color: var(--text-primary);
      padding: 6px 12px 6px 30px;
      border-radius: var(--radius-md);
      font-size: 13px;
      width: 220px;
      transition: width 200ms var(--ease-std), border-color 150ms var(--ease-std);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--adv-blue);
      width: 280px;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .lang-switcher {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-md);
      padding: 2px;
      gap: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: color 150ms var(--ease-std), background 150ms var(--ease-std);
    }

    .lang-btn:hover {
      color: var(--text-primary);
    }

    .lang-btn.active {
      background: var(--bg-raised);
      color: var(--text-primary);
    }

    /* SUB-HEADER: Progress & Official Portal Link */
    .sub-bar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--hairline);
      height: 38px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .progress-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 480px;
    }

    .progress-track {
      flex: 1;
      height: 6px;
      background: var(--bg-raised);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--adv-blue);
      width: 0%;
      transition: width 300ms var(--ease-std);
    }

    .portal-link {
      color: var(--text-secondary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      transition: color 150ms var(--ease-std);
    }

    .portal-link:hover {
      color: var(--adv-blue-hover);
    }

    /* MAIN SKILL TREE VIEWPORT */
    .tree-viewport {
      max-width: 1400px;
      margin: 24px auto 64px auto;
      padding: 0 24px;
    }

    /* TIER SECTIONS */
    .tree-tier {
      margin-bottom: 32px;
    }

    .tier-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--hairline);
    }

    .tier-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.1px;
    }

    .tier-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    /* SKILL NODE CARD: Pure Industrial Craft */
    .node-card {
      background: var(--bg-card);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg);
      padding: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 150px;
      transition: background 150ms var(--ease-std), border-color 150ms var(--ease-std), transform 150ms var(--ease-std);
      position: relative;
    }

    .node-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--hairline-hover);
      transform: translateY(-2px);
    }

    .node-card.mastered {
      border-color: rgba(16, 185, 129, 0.3);
      background: #141b24;
    }

    .node-card.dimmed {
      opacity: 0.25;
      filter: grayscale(1);
      pointer-events: none;
    }

    .node-card.highlighted {
      border-color: var(--adv-blue);
      background: #151e2e;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .node-icon-box {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .node-card:hover .node-icon-box {
      color: var(--text-primary);
      border-color: var(--hairline-hover);
    }

    .node-meta {
      flex: 1;
      min-width: 0;
    }

    .node-code-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .code-tags-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .node-code {
      font-size: 11px;
      font-weight: 500;
      color: var(--adv-blue-hover);
      letter-spacing: 0.5px;
    }

    .has-anim-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(0, 102, 204, 0.15);
      border: 1px solid rgba(0, 102, 204, 0.3);
      color: #93c5fd;
      font-weight: 500;
    }

    .mastered-badge {
      display: none;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      color: var(--status-green);
      font-weight: 500;
    }

    .node-card.mastered .mastered-badge {
      display: flex;
    }

    .node-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text-primary);
    }

    .node-summary {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .node-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid var(--hairline);
      font-size: 12px;
    }

    /* Track Tags */
    .track-tag {
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 500;
    }

    .track-tag.customer {
      background: rgba(0, 102, 204, 0.12);
      color: #93c5fd;
      border: 1px solid rgba(0, 102, 204, 0.25);
    }
    .track-tag.warehouse {
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .track-tag.engineering {
      background: rgba(245, 158, 11, 0.12);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
    .track-tag.tools {
      background: rgba(148, 163, 184, 0.12);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .track-tag.all {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      border: 1px solid var(--hairline);
    }

    .node-action-link {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      transition: color 150ms var(--ease-std);
    }

    .node-card:hover .node-action-link {
      color: var(--text-primary);
    }

    /* SLIDE-OVER DRAWER MODAL */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms var(--ease-std);
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 900px;
      max-width: 95vw;
      height: 100vh;
      background: var(--bg-surface);
      border-left: 1px solid var(--hairline);
      transform: translateX(100%);
      transition: transform 250ms var(--ease-std);
      z-index: 210;
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.4);
    }

    .drawer.active {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
    }

    .drawer-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .drawer-icon-box {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }

    .drawer-title-meta {
      font-size: 12px;
      color: var(--adv-blue-hover);
      font-weight: 500;
      margin-bottom: 2px;
    }

    .drawer-title-group h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .drawer-close-btn {
      background: transparent;
      border: 1px solid var(--hairline);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 150ms var(--ease-std), border-color 150ms var(--ease-std);
    }

    .drawer-close-btn:hover {
      color: var(--text-primary);
      border-color: var(--hairline-hover);
    }

    .drawer-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Split Step Layout */
    .split-step-box {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 20px;
      background: var(--bg-card);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    @media (max-width: 820px) {
      .split-step-box {
        grid-template-columns: 1fr;
      }
    }

    .step-left {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Key UI Action Box */
    .action-box {
      background: var(--bg-surface);
      border: 1px solid var(--hairline);
      border-left: 3px solid var(--adv-blue);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
    }

    .action-box-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--adv-blue-hover);
      margin-bottom: 6px;
      font-size: 12px;
    }

    /* Industrial UI Keycap / Tag */
    .ui-btn-tag {
      background: #202736;
      color: #93c5fd;
      border: 1px solid rgba(147, 197, 253, 0.25);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      padding: 1px 6px;
      border-radius: 4px;
      display: inline-block;
      margin: 0 2px;
    }

    .step-desc-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    /* Callout Boxes */
    .callout {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 12px;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .callout-icon {
      flex-shrink: 0;
      margin-top: 1px;
    }

    .callout.warning {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      color: #fcd34d;
    }

    .callout.tip {
      background: rgba(0, 102, 204, 0.08);
      border: 1px solid rgba(0, 102, 204, 0.2);
      color: #93c5fd;
    }

    /* Right Media Container */
    .step-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Media Switcher Tab Row */
    .media-tabs-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-md);
      padding: 2px;
      width: fit-content;
    }

    .media-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 150ms var(--ease-std), background 150ms var(--ease-std);
      user-select: none;
    }

    .media-tab-btn:hover {
      color: var(--text-primary);
    }

    .media-tab-btn.active {
      background: var(--bg-raised);
      color: var(--text-primary);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .drawer-media-frame {
      position: relative;
      background: #000;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-md);
      min-height: 220px;
      max-height: 340px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
    }

    .drawer-media-elem {
      max-width: 100%;
      max-height: 340px;
      object-fit: contain;
      display: block;
    }

    video.drawer-media-elem {
      outline: none;
      background: #000;
    }

    .media-zoom-overlay {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(12, 14, 20, 0.85);
      border: 1px solid var(--hairline);
      color: var(--text-secondary);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
    }

    .gif-script-box {
      background: var(--bg-surface);
      border: 1px dashed var(--hairline);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .gif-script-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    /* Drawer Footer */
    .drawer-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--hairline);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn {
      padding: 7px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 150ms var(--ease-std), border-color 150ms var(--ease-std), color 150ms var(--ease-std);
      user-select: none;
    }

    .btn-secondary {
      background: var(--bg-surface);
      border: 1px solid var(--hairline);
      color: var(--text-primary);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .btn-secondary:hover {
      background: var(--bg-raised);
      border-color: var(--hairline-hover);
    }

    .btn-secondary.is-mastered {
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--status-green);
    }

    .btn-primary {
      background: var(--adv-blue);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--adv-blue-hover);
    }

    /* LIGHTBOX MODAL */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-media-elem {
      max-width: 95vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: var(--radius-md);
      border: 1px solid var(--hairline);
    }

    .lightbox-close-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px;
    }

    .lightbox-close-btn:hover {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <header>
    <div class="brand">
      <img src="media/advantech-logo.svg" alt="Advantech" class="brand-logo" width="120" height="25">
      <div class="brand-divider"></div>
      <div class="brand-title">
        eRMA <span class="brand-subtitle">Skill Tree SOP</span>
      </div>
    </div>

    <!-- Role / Track Switcher -->
    <div class="track-filters">
      <button class="filter-btn active" data-track="all">

      all: { zh: '全覽技能樹', en: 'All Skills', ja: '全覽ツリー' },
      customer: { zh: '客戶報修路線', en: 'Customer Track', ja: 'お客様申請ルート' },
      warehouse: { zh: '倉庫點收路線', en: 'Warehouse Track', ja: '倉庫受入ルート' },
      engineering: { zh: '工程維修路線', en: 'Engineering Track', ja: '技術修理ルート' },
      tools: { zh: '工具與管理路線', en: 'Tools & Query', ja: '照会・管理ルート' }
    };

    // --- RENDER TREE ---
    function renderTree() {
      const container = document.getElementById('treeContainer');
      container.innerHTML = '';

      // Update Filter Labels
      document.querySelector('.t-all').textContent = TRACK_NAMES.all[currentLang];
      document.querySelector('.t-cust').textContent = TRACK_NAMES.customer[currentLang];
      document.querySelector('.t-wh').textContent = TRACK_NAMES.warehouse[currentLang];
      document.querySelector('.t-eng').textContent = TRACK_NAMES.engineering[currentLang];
      document.querySelector('.t-tool').textContent = TRACK_NAMES.tools[currentLang];

      const searchLower = currentSearch.toLowerCase().trim();

      // Group nodes by tier (0 to 4)
      const tiers = [0, 1, 2, 3, 4];
      tiers.forEach(tierIdx => {
        const tierNodes = SKILL_TREE_DATA.filter(n => n.tier === tierIdx);
        if (tierNodes.length === 0) return;

        const firstNode = tierNodes[0];
        const tierTitle = firstNode.tierName[currentLang];
        const tierDesc = firstNode.tierDesc[currentLang];

        const tierEl = document.createElement('section');
        tierEl.className = 'tree-tier';

        const headerEl = document.createElement('div');
        headerEl.className = 'tier-header';
        headerEl.innerHTML = `
          <h2 class="tier-title">${tierTitle}</h2>
          <span class="tier-desc">${tierDesc}</span>
        `;
        tierEl.appendChild(headerEl);

        const grid = document.createElement('div');
        grid.className = 'nodes-grid';
        tierEl.appendChild(grid);
        container.appendChild(tierEl);

        tierNodes.forEach(node => {
          const isTrackMatch = currentTrack === 'all' || node.track === currentTrack || node.track === 'all';
          const isSearchMatch = !searchLower ||
            node.code.toLowerCase().includes(searchLower) ||
            node.title[currentLang].toLowerCase().includes(searchLower) ||
            node.summary[currentLang].toLowerCase().includes(searchLower);

          const isMastered = masteredNodes.includes(node.id);
          const hasVideo = !!node.video;

          const card = document.createElement('div');
          card.className = `node-card ${isMastered ? 'mastered' : ''}`;
          if (!isTrackMatch) card.classList.add('dimmed');
          if (searchLower && isSearchMatch) card.classList.add('highlighted');

          card.onclick = () => openDrawer(node.id);

          const iconSvg = NODE_ICONS[node.id] || UI_ICONS['wrench'];

          const videoPillHtml = hasVideo ? `
            <span class="has-anim-pill" title="Contains 5s Video/GIF demo">
              ${UI_ICONS['video']}
              <span>${currentLang === 'zh' ? '動態演示' : (currentLang === 'ja' ? '動画あり' : 'Animation')}</span>
            </span>
          ` : '';

          card.innerHTML = `
            <div>
              <div class="card-top">
                <div class="node-icon-box">${iconSvg}</div>
                <div class="node-meta">
                  <div class="node-code-row">
                    <div class="code-tags-group">
                      <span class="node-code tabular">${node.code}</span>
                      ${videoPillHtml}
                    </div>
                    <span class="mastered-badge">
                      ${UI_ICONS['check']}
                      <span>${currentLang === 'zh' ? '已掌握' : (currentLang === 'ja' ? '習得済' : 'Mastered')}</span>
                    </span>
                  </div>
                  <h3 class="node-title">${node.title[currentLang]}</h3>
                </div>
              </div>
              <div class="node-summary">${node.summary[currentLang]}</div>
            </div>
            <div class="node-footer">
              <span class="track-tag ${node.track}">${node.trackLabel[currentLang]}</span>
              <span class="node-action-link">
                <span>${currentLang === 'zh' ? '查看步驟' : (currentLang === 'ja' ? '詳細を見る' : 'Details')}</span>
                ${UI_ICONS['arrow-right']}
              </span>
            </div>
          `;

          grid.appendChild(card);
        });
      });

      updateProgress();
    }

    // --- PROGRESS UPDATE ---
    function updateProgress() {
      const total = SKILL_TREE_DATA.length;
      const count = masteredNodes.length;
      const pct = Math.round((count / total) * 100);

      const labelMap = {
        zh: `學習進度：${count} / ${total} (${pct}%)`,
        en: `Progress: ${count} / ${total} (${pct}%)`,
        ja: `進捗状況：${count} / ${total} (${pct}%)`
      };

      document.getElementById('progressText').textContent = labelMap[currentLang];
      document.getElementById('progressFill').style.width = pct + '%';
    }

    // --- MEDIA SWITCHER IN DRAWER ---
    function switchMediaMode(mode) {
      currentMediaMode = mode;
      const node = SKILL_TREE_DATA[activeNodeIndex];
      const vElem = document.getElementById('dVideo');
      const iElem = document.getElementById('dImg');
      const tabV = document.getElementById('tabVideo');
      const tabI = document.getElementById('tabImage');

      if (mode === 'video' && node.video) {
        vElem.src = node.video;
        vElem.style.display = 'block';
        vElem.play().catch(() => {});
        iElem.style.display = 'none';
        tabV.classList.add('active');
        tabI.classList.remove('active');
      } else {
        vElem.pause();
        vElem.style.display = 'none';
        iElem.src = node.img;
        iElem.style.display = 'block';
        tabV.classList.remove('active');
        tabI.classList.add('active');
      }
    }

    // --- DRAWER (MODAL) ---
    function openDrawer(nodeId) {
      const idx = SKILL_TREE_DATA.findIndex(n => n.id === nodeId);
      if (idx === -1) return;
      activeNodeIndex = idx;
      const node = SKILL_TREE_DATA[idx];

      const iconSvg = NODE_ICONS[node.id] || UI_ICONS['wrench'];
      document.getElementById('dIconBox').innerHTML = iconSvg;
      document.getElementById('dCode').textContent = node.code + ' • ' + node.trackLabel[currentLang];
      document.getElementById('dTitle').textContent = node.title[currentLang];
      document.getElementById('dAction').innerHTML = node.action[currentLang];
      document.getElementById('dDesc').textContent = node.desc[currentLang];
      document.getElementById('dWarning').textContent = node.warning[currentLang];
      document.getElementById('dTip').textContent = node.tip[currentLang];

      // Handle Media (Video vs Image)
      const tabsBar = document.getElementById('mediaTabsBar');
      if (node.video) {
        tabsBar.style.display = 'flex';
        document.getElementById('labelTabVideo').textContent = currentLang === 'zh' ? '5s 動態演示' : (currentLang === 'ja' ? '5秒 動画示範' : '5s Animation');
        document.getElementById('labelTabImage').textContent = currentLang === 'zh' ? '靜態截圖' : (currentLang === 'ja' ? '静止画スクショ' : 'Screenshot');
        switchMediaMode('video');
      } else {
        tabsBar.style.display = 'none';
        switchMediaMode('image');
      }

      // Script / Animation Status Box
      const scriptHeader = document.getElementById('dScriptHeader');
      const scriptIcon = document.getElementById('dScriptIcon');
      const scriptTitle = document.getElementById('dScriptTitle');
      const scriptBody = document.getElementById('dScript');

      if (node.video) {
        scriptHeader.style.color = 'var(--status-green)';
        scriptIcon.innerHTML = UI_ICONS['check'];
        scriptTitle.textContent = currentLang === 'zh' ? '動態操作示範已上線：' : (currentLang === 'ja' ? '操作動画が有効です：' : 'Dynamic Animation Enabled:');
        scriptBody.innerHTML = `<strong>${currentLang === 'zh' ? '示範重點' : (currentLang === 'ja' ? '要点' : 'Highlights')}：</strong>${node.script}`;
      } else {
        scriptHeader.style.color = 'var(--text-primary)';
        scriptIcon.innerHTML = UI_ICONS['video'];
        scriptTitle.textContent = currentLang === 'zh' ? '建議錄製 5~10 秒 GIF 腳本：' : (currentLang === 'ja' ? '5〜10秒 GIF 録画ガイド：' : '5~10s GIF Recording Guide:');
        scriptBody.textContent = node.script;
      }

      // Update Mastery Button State
      const isMastered = masteredNodes.includes(node.id);
      const btn = document.getElementById('btnMastery');
      if (isMastered) {
        btn.classList.add('is-mastered');
        document.getElementById('masteryIcon').innerHTML = UI_ICONS['check'];
        document.getElementById('masteryLabel').textContent = currentLang === 'zh' ? '已掌握技能 (Mastered)' : (currentLang === 'ja' ? '習得済み' : 'Mastered');
      } else {
        btn.classList.remove('is-mastered');
        document.getElementById('masteryIcon').innerHTML = UI_ICONS['star'];
        document.getElementById('masteryLabel').textContent = currentLang === 'zh' ? '標記已掌握 (Mark Mastered)' : (currentLang === 'ja' ? '習得済みにする' : 'Mark as Mastered');
      }

      // Action label text by lang
      document.getElementById('dActionLabel').textContent = currentLang === 'zh' ? '核心操作指令：' : (currentLang === 'ja' ? '主な操作手順：' : 'Key UI Action:');
      document.getElementById('nextSkillLabel').textContent = currentLang === 'zh' ? '下一技能' : (currentLang === 'ja' ? '次のスキル' : 'Next Skill');
      document.getElementById('zoomLabel').textContent = currentLang === 'zh' ? '點擊放大檢視' : (currentLang === 'ja' ? '拡大表示' : 'Enlarge view');

      document.getElementById('drawerOverlay').classList.add('active');
      document.getElementById('nodeDrawer').classList.add('active');
    }

    function closeDrawer() {
      const vElem = document.getElementById('dVideo');
      if (vElem) vElem.pause();
      document.getElementById('drawerOverlay').classList.remove('active');
      document.getElementById('nodeDrawer').classList.remove('active');
    }

    function toggleMastery() {
      const node = SKILL_TREE_DATA[activeNodeIndex];
      const idx = masteredNodes.indexOf(node.id);
      if (idx > -1) {
        masteredNodes.splice(idx, 1);
      } else {
        masteredNodes.push(node.id);
      }
      localStorage.setItem('erma_mastered_nodes', JSON.stringify(masteredNodes));
      openDrawer(node.id);
      renderTree();
    }

    function nextSkill() {
      activeNodeIndex = (activeNodeIndex + 1) % SKILL_TREE_DATA.length;
      openDrawer(SKILL_TREE_DATA[activeNodeIndex].id);
    }

    // --- LIGHTBOX ---
    function openLightbox() {
      const node = SKILL_TREE_DATA[activeNodeIndex];
      const lv = document.getElementById('lightboxVideo');
      const li = document.getElementById('lightboxImg');

      if (currentMediaMode === 'video' && node.video) {
        lv.src = node.video;
        lv.style.display = 'block';
        lv.play().catch(() => {});
        li.style.display = 'none';
      } else {
        lv.pause();
        lv.style.display = 'none';
        li.src = node.img;
        li.style.display = 'block';
      }

      document.getElementById('lightboxModal').classList.add('active');
    }

    function closeLightbox() {
      const lv = document.getElementById('lightboxVideo');
      if (lv) lv.pause();
      document.getElementById('lightboxModal').classList.remove('active');
    }

    // --- EVENT LISTENERS ---
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTrack = btn.dataset.track;
        renderTree();
      });
    });

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = btn.dataset.lang;
        renderTree();
        if (document.getElementById('nodeDrawer').classList.contains('active')) {
          openDrawer(SKILL_TREE_DATA[activeNodeIndex].id);
        }
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearch = e.target.value;
      renderTree();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeLightbox();
        closeDrawer();
      }
    });

    // Initial Render
    renderTree();
  </script>
</body>
</html>
